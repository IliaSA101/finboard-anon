[package]
name = "finboard-anon"
version = "0.3.0"
edition = "2021"
description = "Обезличивание персональных данных в Excel (xlsx) с сохранением дашбордов"
license = "GPL-3.0-only"
repository = "https://github.com/IliaSA101/finboard-anon"

[lib]
name = "finboard_anon"
path = "src/lib.rs"

[[bin]]
name = "finboard-anon"
path = "src/main.rs"

[[bin]]
name = "finboard-anon-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
quick-xml = "0.36"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
aho-corasick = "1.1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
# Таблица символов не нужна и хранит пути машины сборки (имена символов import-библиотек).
strip = true
